# Config for extract_walls_and_aps.py
# Coordinates are PDF points with origin at the top-left of the PDF page.

input:
  # Put the PDF next to this config file, or replace this with an absolute path.
  pdf_path: "trajectory.pdf"
  page_index: 0

folders:
  # Intermediate renders/masks/diagnostics are written here.
  processing_dir: "./processing"

  # Final user-facing files are written here. The script writes ONLY:
  #   - wall_curves.csv
  #   - ap_positions.csv
  output_dir: "./output"

  # If true, all old files/folders inside output_dir and processing_dir are removed before each run.
  clean_output_dir: true
  clean_processing_dir: true

output:
  wall_curves_csv: "wall_curves.csv"
  ap_positions_csv: "ap_positions.csv"

render:
  dpi: 300

# Strict plan crop. This excludes sheet frame/footer/title block as much as possible.
plan_roi_pdf_pt:
  x0: 10.0
  y0: 200.8
  x1: 805.0
  y1: 352.0

wall_extraction:
  # Black vector strokes are wall candidates before filtering/uniting.
  black_max_channel: 0.08
  min_stroke_width_pdf_pt: 0.045
  curve_sampling_points: 32

  # Stroke width used when vector paths are rasterized into the wall mask.
  draw_width_scale: 2.0
  min_draw_width_px: 1
  min_polyline_length_pdf_pt: 0.04

  # Removes narrow bands at ROI borders after rasterization.
  suppress_border_px:
    top: 14
    bottom: 0
    left: 0
    right: 0

footnote_leader_filter:
  enabled: true

  # Footnote leaders are treated as black vector paths too, so they are removed
  # before wall-fragment union.
  black_max_channel: 0.08
  stroke_width_pdf_pt_min: 0.045
  stroke_width_pdf_pt_max: 0.30

  # Leader shape: exactly two connected line segments -> three merged points.
  required_line_item_count: 2
  required_vertex_count: 3
  point_merge_tol_pdf_pt: 0.35

  # Compact 3-point leader geometry.
  branch_length_min_pdf_pt: 1.2
  branch_length_max_pdf_pt: 14.5
  short_branch_length_max_pdf_pt: 6.5
  bbox_span_max_pdf_pt: 16.0

  # Shelf-to-foot bend is around 135 deg; use a tolerance range.
  bend_angle_deg_min: 105.0
  bend_angle_deg_max: 158.0

  # In this drawing the shelf is almost horizontal and the foot is about 45 deg.
  shelf_angle_to_horizontal_max_deg: 12.0
  foot_angle_to_horizontal_min_deg: 25.0
  foot_angle_to_horizontal_max_deg: 70.0

wall_union:
  # Unites close wall fragments before skeleton tracing.
  close_kernel_px: 5
  close_iterations: 1

  # Connected-component filter after uniting. Small isolated components are usually labels/footnotes.
  min_component_area_px: 400
  min_component_span_px: 70
  min_slender_component_area_px: 250
  min_slender_component_span_px: 85
  min_long_component_span_px: 160
  min_long_component_area_px: 180

  # Curve tracing/simplification.
  min_curve_length_px: 10.0
  curve_simplify_epsilon_px: 2.2

ap_extraction:
  color_tolerance: 0.035
  colors_rgb_0_1:
    orange: [0.973, 0.600, 0.118]
    violet: [0.369, 0.404, 0.686]

  dbscan_eps_pdf_pt: 0.8
  dbscan_min_samples: 4
  min_cluster_items: 8
  bbox_width_pdf_pt_min: 0.4
  bbox_width_pdf_pt_max: 2.5
  bbox_height_pdf_pt_min: 0.4
  bbox_height_pdf_pt_max: 2.8

debug:
  # Debug files go to processing_dir, never to output_dir.
  save_processing_images: true
  save_removed_footnote_leaders_csv: true
  save_component_diagnostics_csv: true
